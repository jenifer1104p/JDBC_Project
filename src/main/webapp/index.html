<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student CRUD</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Student Management System</h1>


        <!-- Student Form -->

        <div class="form-box">

            <h2>Student Details</h2>

            <form action="student" method="post">

                <label>Student ID</label>

                <input
                    type="number"
                    name="id"
                    placeholder="Enter Student ID"
                    required
                >


                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter Student Name"
                    required
                >


                <label>Course</label>

                <input
                    type="text"
                    name="course"
                    placeholder="Enter Course"
                    required
                >


                <label>Marks</label>

                <input
                    type="number"
                    name="marks"
                    placeholder="Enter Marks"
                    min="0"
                    max="100"
                    required
                >


                <!-- Buttons -->

                <div class="buttons">

                    <button
                        type="submit"
                        name="action"
                        value="insert"
                        class="insert">
                        Insert
                    </button>


                    <button
                        type="submit"
                        name="action"
                        value="update"
                        class="update">
                        Update
                    </button>


                    <button
                        type="submit"
                        name="action"
                        value="delete"
                        class="delete"
                        onclick="return confirmDelete()">
                        Delete
                    </button>


                    <button
                        type="button"
                        class="view"
                        onclick="viewStudents()">
                        View
                    </button>

                </div>

            </form>

        </div>


        <!-- Student Table -->

        <div class="table-box">

            <h2>Student List</h2>

            <div id="studentTable">

                <p>
                    Click View to display students.
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
